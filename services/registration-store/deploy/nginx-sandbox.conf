    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location = /sandbox/health {
    access_log off;
    proxy_pass http://127.0.0.1:8788/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

