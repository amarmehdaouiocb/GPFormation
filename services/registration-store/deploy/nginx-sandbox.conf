location = /v1/registrations/paid {
    limit_req zone=registration_api burst=20 nodelay;
    limit_except GET {
        deny all;
    }
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}

location = /sandbox/health {
    access_log off;
    proxy_pass http://127.0.0.1:8788/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location = /sandbox/v1/registrations/paid {
    limit_req zone=registration_api burst=20 nodelay;
    limit_except GET {
        deny all;
    }
    proxy_pass http://127.0.0.1:8788/v1/registrations/paid;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}

location /sandbox/v1/ {
    limit_req zone=registration_api burst=20 nodelay;
    limit_except PUT POST {
        deny all;
    }
    proxy_pass http://127.0.0.1:8788/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}
